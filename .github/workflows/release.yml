name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: ''
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      # No Apple code signing for v1.0.0 — the DMG ships unsigned and users
      # see the unverified-developer warning on first launch (right-click →
      # Open bypasses). Re-enable by adding the six APPLE_* secrets and
      # uncommenting. Passing `${{ secrets.X }}` with an unset secret expands
      # to '' which trips `security import` with an invalid cert.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ProxyOrbit ${{ github.ref_name }}'
          releaseBody: |
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # tauri-action uploads bundles but not .sig files.
      # Re-sign the tar.gz we know tauri built, then upload the .sig.
      - name: Sign and upload updater signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          sign() {
            local tgz="$1" upload_name="$2"
            [ -f "$tgz" ] || return 0
            echo "Signing $tgz -> $upload_name"
            npx @tauri-apps/cli signer sign "$tgz" \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" 2>/dev/null || true
            if [ -f "${tgz}.sig" ]; then
              cp "${tgz}.sig" "/tmp/${upload_name}"
              gh release upload "${{ github.ref_name }}" "/tmp/${upload_name}" \
                --repo "${{ github.repository }}" --clobber
              echo "  uploaded ${upload_name}"
            fi
          }
          sign "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ProxyOrbit.app.tar.gz" \
               "ProxyOrbit_aarch64.app.tar.gz.sig"
          sign "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ProxyOrbit.app.tar.gz" \
               "ProxyOrbit_x64.app.tar.gz.sig"
          for f in src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz; do
            [ -f "$f" ] || continue
            sign "$f" "$(basename "$f").sig"
          done
          for f in src-tauri/target/release/bundle/nsis/*-setup.nsis.zip; do
            [ -f "$f" ] || continue
            sign "$f" "$(basename "$f").sig"
          done
