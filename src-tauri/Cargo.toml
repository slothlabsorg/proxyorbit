[package]
name = "proxyorbit"
version = "1.0.0"
description = "ProxyOrbit — HTTP/HTTPS proxy inspector"
authors = ["SlothLabs"]
edition = "2021"

[lib]
name = "proxyorbit_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = ["unstable"] }
tauri-plugin-shell   = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
hyper        = { version = "0.14", features = ["full"] }
hyper-tls    = "0.5"
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
anyhow       = "1"
dirs         = "5"
# Cross-platform signal handler so SIGTERM / SIGINT clean up launchd env
# vars before the process dies. Tauri's RunEvent::Exit only fires for the
# graceful Cmd+Q / window-close path; signal-killed processes skip it.
ctrlc        = { version = "3", features = ["termination"] }

# MITM HTTPS inspection: generate a self-signed CA on first run and mint
# per-host leaf certs on the fly. The proxy accepts the client's TLS with
# the leaf cert (user trusts our CA) and opens a separate TLS to the real
# server — enabling header / body inspection for HTTPS traffic.
rcgen          = { version = "0.13", features = ["pem"] }
rustls         = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls   = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
pem            = "3"
time           = "0.3"

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
